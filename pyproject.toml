[project]
name = "perceval-collector"
version = "0.1.0"
description = "Incremental git activity collector (Perceval) writing JSONL"
requires-python = ">=3.12,<3.13"
dependencies = [
    "jsonschema>=4.26.0",
    "perceval==1.6.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["rag"]
branch = true
# __main__.py is a one-line entry point; test_python_m_rag_help_runs runs it in a subprocess.
omit = ["src/rag/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
]
