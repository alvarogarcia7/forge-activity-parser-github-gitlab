# Egress allowlist proxy. Anything not in allowed_domains.txt is denied.
http_port 3128

acl allowed dstdomain "/run/squid/allowed_domains.txt"
acl SSL_ports port 443
acl Safe_ports port 80 443
acl CONNECT method CONNECT

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow allowed
http_access deny all

# No disk cache, no state outside /run/squid (tmpfs), logs to container stdout
cache deny all
pid_filename /run/squid/squid.pid
access_log stdio:/dev/stdout
cache_log stdio:/dev/stderr
cache_store_log none
coredump_dir /run/squid
logfile_rotate 0
shutdown_lifetime 1 seconds
visible_hostname egress-proxy
forwarded_for delete
